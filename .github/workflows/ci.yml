name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install flake8

      - name: Validate Python syntax (py_compile)
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('app').rglob('*.py')]; print('Python syntax OK')"

      - name: Lint backend (flake8)
        run: flake8 app/ || true

      - name: Verify backend import
        run: python -c "from app.main import app; print(app.title)"

      - name: Run pytest if tests exist
        run: |
          if [ -d tests ] && find tests -type f -name "test_*.py" | grep -q .; then
            pytest || true
          else
            echo "No pytest tests found, skipping."
          fi

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-api-auditor-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: ai-api-auditor-frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('ai-api-auditor-frontend/package-lock.json', 'ai-api-auditor-frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install frontend dependencies
        run: npm install

      - name: Lint frontend if script exists
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.lint ? 0 : 1)"; then
            npm run lint || true
          else
            echo "No lint script found, skipping."
          fi

      - name: Build frontend
        run: npm run build
