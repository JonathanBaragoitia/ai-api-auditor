repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=120
          - --extend-ignore=E203,W503
        files: ^(app|tests)/

  - repo: local
    hooks:
      - id: block-generated-python-artifacts
        name: block generated Python artifacts
        entry: No subas __pycache__ ni archivos .pyc; elimina esos artefactos antes de commitear.
        language: fail
        files: (^|/)__pycache__/|\.pyc$

      - id: block-local-databases
        name: block local database files
        entry: No subas bases de datos locales .db; usa migraciones y variables de entorno.
        language: fail
        files: \.db$

      - id: frontend-eslint
        name: frontend eslint
        entry: npm --prefix ai-api-auditor-frontend run lint
        language: system
        pass_filenames: false
        files: ^ai-api-auditor-frontend/.*\.(js|jsx)$
