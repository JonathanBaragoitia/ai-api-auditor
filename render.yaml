services:
  - type: web
    name: ai-api-auditor-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "60"
